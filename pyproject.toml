[project]
name = "cli-mcp-client"
version = "0.1.0"
description = "A Metasploit-styled REPL client for chatting with a remote LLM and configurable MCP servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "prompt-toolkit>=3.0",
    "rich>=13.7",
    "mcp>=1.2.0",
    "tiktoken>=0.7",
]

[project.scripts]
mcpc = "cli_mcp_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_mcp_client"]
